
name: Build Windows Rust Wheel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Maturin
        run: python -m pip install "maturin>=1.12,<2"

      - name: Build Windows wheel
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          maturin build --release --manifest-path rust/crates/openjarvis-python/Cargo.toml --interpreter python --out dist

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: openjarvis-rust-windows
          path: dist/*.whl
          if-no-files-found: error
